[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zest"
version = "0.1.0"
description = "Zest control-plane package (Core, Research, Application, Data, Platform ports, Interface)."
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0,<3",
    "psycopg[binary]>=3.1.0,<4",
    "alembic>=1.13.0,<2",
    "jsonschema>=4.18.0,<5",
    "referencing>=0.30.0,<1",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.49"]
gemini = ["google-genai>=1.0"]
models = ["openai>=1.40", "anthropic>=0.49", "google-genai>=1.0"]
browser = ["playwright>=1.49,<2"]

[project.scripts]
zest = "zest.interface.cli:main"
zest-dashboard = "zest.interface.dashboard:main"
zestd = "zest.interface.zestd:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zest"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/zest",
    "/docs/README.md",
    "/alembic.ini",
    "/alembic",
    "/deploy",
]
exclude = [
    "/.venv",
    "/.git",
    "/var",
    "/.pytest_cache",
    "/htmlcov",
]
