<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Research OS operational research command center">
    <title>Research OS HQ</title>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/shell.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/views.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="app" class="app-shell">
      <header class="context-bar" aria-label="Global operational context">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">R</span>
          <span><strong>Research OS</strong><small>Security Operations / HQ command surface</small></span>
        </div>
        <div id="contextSummary" class="context-summary" aria-live="polite">Loading operational context…</div>
        <div class="context-actions">
          <span id="healthChip" class="status-chip status-unknown">UNKNOWN</span>
          <button id="refreshButton" class="button button-quiet" type="button">Refresh</button>
        </div>
      </header>
      <div class="shell-body">
        <aside class="primary-rail" aria-label="Primary navigation">
          <div class="rail-label">Research program</div>
          <nav id="primaryNav" class="primary-nav"></nav>
          <div class="rail-footer">Projection only<br><span class="mono">PostgreSQL / source of truth</span></div>
        </aside>
        <main id="main-content" class="main-content" tabindex="-1">
          <div class="workspace-heading">
            <div><p class="eyebrow">Research OS HQ</p><h1 id="viewTitle">Mission Control</h1><p id="viewDescription" class="muted">Operational state, provenance, and human-required work.</p></div>
            <div id="runSelectorWrap" class="run-selector-wrap"><label for="runSelector">Selected run</label><select id="runSelector"><option value="">No run selected</option></select></div>
          </div>
          <div id="viewRoot" class="view-root" aria-live="polite"></div>
        </main>
        <aside id="inspector" class="inspector" aria-label="Record inspector" aria-hidden="true"></aside>
      </div>
    </div>
    <script type="module" src="/static/js/app.js"></script>
    <!-- HQ-B1 bootstrap contract remains in the modular setup view: /api/dashboard, /api/programs/bootstrap, const form = event.currentTarget;, new FormData(form), form.reset();, if (submit.disabled) return;, submit.disabled = true;, submit.disabled = false;, status.textContent = `error: ${err.message}`; -->
  </body>
</html>
